{{/* Appointment request form. Shared by every /contact/ layout variant.

     The `name` attributes are what FormBold (formbold.com/s/3w5QY) uses to label
     each field in the notification email, so they are written to read well there
     rather than to match the visible <label> text. Changing a name changes the
     label on every email from that point on — old submissions keep the old one. */}}
<form class="ms-form"
      action="https://formbold.com/s/3w5QY"
      method="POST"
      enctype="multipart/form-data">

  <div class="ms-field">
    <label for="ms-name">Name <span class="ms-req" aria-hidden="true">*</span></label>
    <input id="ms-name" type="text" required
           name="Enter Name"
           autocomplete="name" placeholder="First and last name" />
  </div>

  <div class="ms-field-row">
    <div class="ms-field">
      <label for="ms-email">Email <span class="ms-req" aria-hidden="true">*</span></label>
      <input id="ms-email" type="email" required
             name="Enter Email Address"
             autocomplete="email" placeholder="you@example.com" />
    </div>
    <div class="ms-field">
      <label for="ms-phone">Phone <span class="ms-req" aria-hidden="true">*</span></label>
      <input id="ms-phone" type="tel" required
             name="Enter Phone Number"
             autocomplete="tel" placeholder="(203) 555-0100" />
    </div>
  </div>

  <div class="ms-field">
    <label for="ms-reason">What brings you here? <span class="ms-req" aria-hidden="true">*</span></label>
    <textarea id="ms-reason" rows="5" required
              name="How can we help?"
              placeholder="Fill out few sentences about what you are looking for."></textarea>
    <p class="ms-field__hint">
      Please don&rsquo;t include detailed medical information. This form is not
      encrypted; we&rsquo;ll move to a secure channel once we&rsquo;re in touch.
    </p>
  </div>

  <button type="submit" class="ms-btn ms-btn--primary ms-form__submit">
    Request an appointment
  </button>

  <p class="ms-form__note">
    <span class="ms-req" aria-hidden="true">*</span> Required. We reply within one
    business day, and never share your details.
  </p>
</form>
